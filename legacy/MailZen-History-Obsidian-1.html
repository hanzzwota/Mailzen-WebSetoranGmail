<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090c10">
<title>Riwayat Setoran — MailZen</title>
<style>
:root{--bg:#090c10;--surface:#121820;--surface2:#171f28;--surface3:#1c2630;--line:#303c48;--text:#edf2f7;--muted:#9ba8b5;--blue:#a9c7df;--blue2:#729fbe;--green:#75c79a;--red:#e58d96;--amber:#d9b978;--shadow:0 18px 42px #0005}
*{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 50% -12%,#293440 0,transparent 43%),radial-gradient(ellipse at 100% 75%,#19232d 0,transparent 38%),var(--bg)}
button,input,select{font:inherit}button{cursor:pointer}.app{width:min(100% - 24px,760px);margin:18px auto 38px}.topbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding:11px 4px;color:#dce4eb}.back{width:36px;height:36px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(145deg,#242e38,#131a21);color:#dce5ed;display:none;place-items:center}.back svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.header-logo{width:38px;height:38px;border-radius:50%;object-fit:cover;border:1px solid #465565;box-shadow:0 4px 12px #0006}.brand{font-size:14px;font-weight:750;letter-spacing:.2px}.brand em{font-style:normal;color:#9ec5e2;margin-left:5px;font-size:11px}.channel{margin-left:auto;border:1px solid var(--line);border-radius:99px;padding:9px 13px;color:#cbd5df;background:#141b22;font-size:12px;display:flex;align-items:center;gap:7px}.channel svg{width:15px;height:15px;stroke:#a8c8e1;fill:none;stroke-width:1.8}
.view{display:none}.view.active{display:block}.panel{border:1px solid #303b46;border-radius:26px;background:linear-gradient(145deg,rgba(24,32,41,.97),rgba(14,19,25,.98));box-shadow:var(--shadow),inset 0 1px #ffffff08}.history-panel{padding:20px 18px 22px}
.search{position:relative;margin-bottom:11px}.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:#a8b5c2;fill:none;stroke-width:1.8}.search input{width:100%;height:48px;border-radius:15px;padding:0 14px 0 43px;background:#0e141a;border:1px solid #303b46;color:var(--text);outline:none;box-shadow:inset 0 2px 8px #0004}.search input:focus{border-color:#8eafca;box-shadow:0 0 0 3px #8eafca18}.search input::placeholder{color:#84919d}
.filter-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:9px 0}.tabs{display:flex;gap:4px;overflow-x:auto;padding:4px;border:1px solid #303b46;border-radius:99px;background:#0e141a;max-width:100%;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{white-space:nowrap;border:0;border-radius:99px;padding:8px 13px;background:transparent;color:#aeb9c4;font-size:12px}.tab.active{background:linear-gradient(145deg,#dce5ec,#8295a6);color:#111820;font-weight:800;box-shadow:0 3px 9px #0005}.select{border:1px solid #34414d;border-radius:13px;padding:9px 12px;background:#111820;color:#dce4eb;font-size:12px;outline:none;min-height:39px}.date-filter{width:100%;display:flex;align-items:center;gap:9px;border:1px solid #34414d;border-radius:14px;padding:10px 12px;background:#111820;color:#b9c5d0;font-size:12px}.date-filter svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8}.date-filter input{margin-left:auto;max-width:145px;background:transparent;border:0;color:#dce4eb;font-size:11px;outline:none}
.results-heading{font-size:13px;color:#aeb9c4;font-weight:750;margin:15px 0 9px}.record-list{display:grid;gap:10px}.record{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 14px;border:1px solid #2d3944;border-radius:20px;background:linear-gradient(120deg,#1b242d,#131a21);box-shadow:inset 0 1px #ffffff06;transition:transform .18s,border-color .18s}.record:active{transform:scale(.99)}.record-main{min-width:0}.record-email{font:500 13px ui-monospace,SFMono-Regular,Consolas,monospace;color:#e1e8ef;overflow-wrap:anywhere;margin-bottom:6px}.record-meta{font-size:11px;color:#9ca9b5;line-height:1.6}.record-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}.status{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:99px;font-size:11px;font-weight:800;border:1px solid transparent;white-space:nowrap}.status svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}.status.approved{background:#153729;color:#8bd4a9;border-color:#286346}.status.pending{background:#382f1b;color:#e7c77f;border-color:#68552b}.status.pending{background:#1c3040;color:#a6cce8;border-color:#365b76}.status.rejected{background:#3a2025;color:#ef9da5;border-color:#70404a}.process-link{border:0;background:none;color:#a9cce8;font-size:11px;font-weight:750;padding:2px 1px}.process-link span{font-size:15px;margin-left:3px}.empty{min-height:320px;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px 20px}.empty-inner{max-width:350px}.empty-icon{width:88px;height:88px;margin:0 auto 20px;border-radius:26px;display:grid;place-items:center;background:linear-gradient(145deg,#394550,#151c23);border:1px solid #566371;box-shadow:0 14px 32px #0007,inset 0 1px #ffffff20}.empty-icon svg{width:42px;height:42px;stroke:#dce6ef;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.empty h2{font-size:19px;margin:0 0 7px}.empty p{font-size:14px;color:#9eabb8;line-height:1.5;margin:0}
.detail-wrap{display:grid;gap:14px}.detail-card{padding:22px 20px}.detail-field{padding:12px 14px;border-radius:15px;background:linear-gradient(120deg,#1c2630,#141c24);border:1px solid #303c48;margin-top:12px}.detail-label{font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:#98a6b3;margin-bottom:6px}.detail-value{font-size:14px;color:#e4ebf2;overflow-wrap:anywhere}.detail-email{font:500 14px ui-monospace,SFMono-Regular,Consolas,monospace}.timeline{padding:22px 20px 24px}.timeline h2{font-size:15px;margin:0 0 20px}.steps{display:grid;gap:0}.step{position:relative;display:grid;grid-template-columns:32px 1fr;gap:12px;min-height:64px}.step:not(:last-child):before{content:"";position:absolute;left:15px;top:31px;bottom:-1px;width:2px;background:#3d5a50}.step.done:not(:last-child):before{background:#4d9676}.step-icon{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:#18382b;border:1px solid #397b59;color:#8bd5aa;position:relative;z-index:1}.step-icon svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.step.current .step-icon{background:#2b3540;border-color:#9abbd5;color:#c3e1f7}.step.current .step-icon svg{animation:spin 1.15s linear infinite}.step.waiting .step-icon{background:#202830;border-color:#3c4854;color:#778591}.step.rejected .step-icon{background:#3a2025;border-color:#70404a;color:#ef9da5}.step.rejected .step-title{color:#ef9da5}.step-content{padding:1px 0 17px}.step-title{font-size:14px;font-weight:800;margin-bottom:3px;color:#e5ebf1}.step-desc{font-size:12px;line-height:1.5;color:#9ba8b4}.step.current .step-title{color:#c5e1f5}.step.waiting .step-title{color:#a2adb8}
.detail-status{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;padding:7px 11px;border:1px solid #394550;border-radius:99px;background:#17212a;color:#c3d0dc;margin-top:3px}.detail-status.approved{color:#8bd4a9;border-color:#286346;background:#153729}.detail-status.rejected{color:#ef9da5;border-color:#70404a;background:#3a2025}
@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media(max-width:520px){.app{width:calc(100% - 20px);margin:10px auto 28px}.topbar{margin-bottom:10px}.history-panel{padding:14px 12px 17px}.record{padding:12px 11px;border-radius:18px;gap:8px}.record-email{font-size:12px}.record-meta{font-size:10px}.record-side{gap:5px}.status{font-size:10px;padding:5px 8px}.process-link{font-size:10px}.tabs{width:100%;justify-content:flex-start}.tab{padding:8px 11px}.select{flex:1}.detail-card,.timeline{padding:18px 16px}.empty{min-height:300px}}
</style>
</head>
<body>
<main class="app">
 <header class="topbar">
  <button class="back" id="back-button" type="button" aria-label="Kembali"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6M9 12h12"/></svg></button>
  <img class="header-logo" src="https://files.catbox.moe/x9jx7c.jpeg" alt="Logo MailZen">
  <div class="brand">MAILZEN <em>RIWAYAT</em></div>
  <div class="channel"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8A8.5 8.5 0 0 1 8.7 3.9a8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/></svg>Saluran WA</div>
 </header>

 <section class="view active" id="history-view">
  <div class="panel history-panel">
   <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="search-input" type="search" placeholder="Cari Gmail..." autocomplete="off"></div>
   <div class="filter-row"><div class="tabs" id="status-tabs">
    <button class="tab active" data-status="Semua">Semua</button><button class="tab" data-status="Pending">Pending (0)</button><button class="tab" data-status="Diterima">Diterima (0)</button><button class="tab" data-status="Ditolak">Ditolak (0)</button>
   </div></div>
   <div class="filter-row">
    <select class="select" id="route-filter" aria-label="Filter jalur"><option value="Semua">Semua Jalur</option><option value="PW">PW</option><option value="Captcha">Captcha</option></select>
    <div class="tabs" id="period-tabs"><button class="tab active" data-period="Semua">Semua</button><button class="tab" data-period="Hari ini">Hari ini</button><button class="tab" data-period="7 Hari">7 Hari</button><button class="tab" data-period="30 Hari">30 Hari</button></div>
   </div>
   <label class="date-filter"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>Filter Tanggal<input id="date-filter" type="date" aria-label="Pilih tanggal"></label>
   <div class="results-heading" id="results-heading">Riwayat Setoran</div>
   <div class="record-list" id="record-list"></div>
   <div class="empty panel" id="empty-state" hidden>
    <div class="empty-inner"><div class="empty-icon"><svg viewBox="0 0 48 48"><path d="M7 17h34l-3 23H10L7 17Z"/><path d="m7 17 6-10h22l6 10M7 17l8 8h18l8-8M20 25h8"/></svg></div><h2>Belum ada setoran</h2><p>Pengajuan kamu akan muncul di sini.</p></div>
   </div>
  </div>
 </section>

 <section class="view" id="detail-view">
  <div class="detail-wrap">
   <div class="panel detail-card">
    <div class="detail-label">Gmail</div><div class="detail-value detail-email" id="detail-email">—</div>
    <div class="detail-field"><div class="detail-label">Jalur</div><div class="detail-value" id="detail-route">—</div></div>
    <div class="detail-field"><div class="detail-label">Tanggal Stor</div><div class="detail-value" id="detail-date">—</div></div>
    <div class="detail-status" id="detail-status">Pending</div>
   </div>
   <div class="panel timeline">
    <h2>Timeline Setoran</h2>
    <div class="steps" id="timeline-steps"></div>
   </div>
  </div>
 </section>
</main>
<script>
(()=>{
 const $=id=>document.getElementById(id);
 // Tidak ada data demo. Isi records dari backend saat halaman dibuka.
 // Akun baru: hasEverSubmitted=false (empty state tampil).
 // Akun yang pernah setor: hasEverSubmitted=true (empty state tidak pernah tampil).\n // Contoh: window.MailZenHistoryConfig={hasEverSubmitted:true,records:[...]};
 const initialConfig = window.MailZenHistoryConfig || {};
 let records = Array.isArray(initialConfig.records) ? initialConfig.records : [];
 let hasEverSubmitted = Boolean(initialConfig.hasEverSubmitted || records.length > 0);
 let selectedStatus='Semua',selectedPeriod='Semua',selectedRecord=null;
 const icons={
  check:'<svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>',
  clock:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  spin:'<svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>',
  pending:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'
 };
 function counts(){return Object.fromEntries(['Pending','Diterima','Ditolak'].map(s=>[s,records.filter(r=>r.status===s).length]))}
 function renderTabs(){const c=counts();document.querySelectorAll('#status-tabs .tab').forEach(b=>{const s=b.dataset.status;b.classList.toggle('active',s===selectedStatus);b.textContent=s==='Semua'?'Semua':`${s} (${c[s]||0})`});document.querySelectorAll('#period-tabs .tab').forEach(b=>b.classList.toggle('active',b.dataset.period===selectedPeriod))}
 function visibleRecords(){
  const q=$('search-input').value.trim().toLowerCase(),route=$('route-filter').value,date=$('date-filter').value;
  return records.filter(r=>(selectedStatus==='Semua'||r.status===selectedStatus)&&(!q||r.email.toLowerCase().includes(q))&&(route==='Semua'||r.route.toLowerCase().includes(route.toLowerCase()))&&(!date||r.isoDate===date));
 }
 function renderList(){
  renderTabs();const rows=visibleRecords();$('record-list').innerHTML='';$('empty-state').hidden=!(rows.length===0 && !hasEverSubmitted && selectedStatus==='Semua' && !$('search-input').value.trim() && $('route-filter').value==='Semua' && !$('date-filter').value);$('record-list').hidden=rows.length===0;
  $('results-heading').textContent=selectedStatus==='Semua'?'Riwayat Setoran':`${selectedStatus} (${rows.length})`;
  rows.forEach(r=>{
   const el=document.createElement('article');el.className='record';
   const cls=r.status==='Diterima'?'approved':r.status==='Ditolak'?'rejected':'pending';
   el.innerHTML=`<div class="record-main"><div class="record-email"></div><div class="record-meta">Stor: ${r.date}<br>Verifikasi: ${r.verifyDate||'Menunggu proses'}</div></div><div class="record-side"><span class="status ${cls}">${icons.check}<span>${r.status}</span></span><button class="process-link" type="button">Lihat Proses <span>›</span></button></div>`;
   el.querySelector('.record-email').textContent=r.email;el.querySelector('.process-link').onclick=()=>openDetail(r.id);$('record-list').appendChild(el);
  });
 }
 function timelineSteps(r){
  const sent = {title:'Setoran Dikirim', desc:`Gmail berhasil dikirim ke sistem · ${r.date}`};
  if(r.status==='Diterima'){
   return [
    {...sent,state:'done'},
    {title:'Pending',desc:'Pengajuan selesai menunggu proses.',state:'done'},
    {title:'Disetujui',desc:'Setoran telah disetujui dan saldo diperbarui.',state:'done'}
   ];
  }
  if(r.status==='Ditolak'){
   return [
    {...sent,state:'done'},
    {title:'Pending',desc:'Pengajuan telah diteruskan untuk diproses.',state:'done'},
    {title:'Ditolak',desc:r.rejectionReason || 'Pengajuan belum dapat disetujui.',state:'rejected'}
   ];
  }
  return [
   {...sent,state:'done'},
   {title:'Pending',desc:'Gmail menunggu untuk diproses.',state:'current'},
   {title:'Disetujui / Ditolak',desc:'Menunggu hasil konfirmasi admin.',state:'waiting'}
  ];
 }
 function openDetail(id){
  selectedRecord=records.find(r=>r.id===id);if(!selectedRecord)return;
  const r=selectedRecord;$('detail-email').textContent=r.email;$('detail-route').textContent=r.route;$('detail-date').textContent=r.date;
  const ds=$('detail-status');ds.textContent=r.status;ds.className='detail-status '+(r.status==='Diterima'?'approved':r.status==='Ditolak'?'rejected':'');
  $('timeline-steps').innerHTML='';
  timelineSteps(r).forEach(s=>{
   const step=document.createElement('div');step.className='step '+s.state;
   const icon=s.state==='done'?icons.check:s.state==='current'?icons.spin:s.state==='rejected'
    ? '<svg viewBox="0 0 24 24"><path d="m18 6-12 12M6 6l12 12"/></svg>' : icons.clock;
   if(s.state==='rejected')step.querySelector;
   step.innerHTML=`<div class="step-icon">${icon}</div><div class="step-content"><div class="step-title"></div><div class="step-desc"></div></div>`;
   step.querySelector('.step-title').textContent=s.title;step.querySelector('.step-desc').textContent=s.desc;$('timeline-steps').appendChild(step);
  });
  $('history-view').classList.remove('active');$('detail-view').classList.add('active');$('back-button').style.display='grid';window.scrollTo({top:0,behavior:'smooth'});
 }
 function showHistory(){$('detail-view').classList.remove('active');$('history-view').classList.add('active');$('back-button').style.display='none';window.scrollTo({top:0,behavior:'smooth'});selectedRecord=null}
 $('back-button').onclick=showHistory;
 document.querySelectorAll('#status-tabs .tab').forEach(b=>b.onclick=()=>{selectedStatus=b.dataset.status;renderList()});
 document.querySelectorAll('#period-tabs .tab').forEach(b=>b.onclick=()=>{selectedPeriod=b.dataset.period;renderList()});
 $('search-input').addEventListener('input',renderList);$('route-filter').addEventListener('change',renderList);$('date-filter').addEventListener('change',renderList);
 // Dashboard/backend integration hooks:
 // window.dispatchEvent(new CustomEvent('history:set-records',{detail:[...] }))
 window.addEventListener('history:set-records',e=>{
  const payload=e.detail;
  if(Array.isArray(payload)){records=payload;hasEverSubmitted=hasEverSubmitted||records.length>0;}
  else if(payload && typeof payload==='object'){
   records=Array.isArray(payload.records)?payload.records:[];
   if(typeof payload.hasEverSubmitted==='boolean')hasEverSubmitted=payload.hasEverSubmitted;
   else hasEverSubmitted=hasEverSubmitted||records.length>0;
  }
  renderList();
 });
 window.addEventListener('history:update-status',e=>{const u=e.detail||{};const r=records.find(x=>x.id===u.id);if(r){r.status=u.status;r.stage=u.stage??r.stage;r.verifyDate=u.verifyDate??r.verifyDate;renderList();if(selectedRecord&&selectedRecord.id===r.id)openDetail(r.id)}});
 window.addEventListener('history:clear',()=>{records=[];hasEverSubmitted=false;renderList();showHistory()});
 // Panggil event ini saat backend berhasil menyimpan setoran pertama akun baru.
 window.addEventListener('history:first-submission',e=>{
  hasEverSubmitted=true;
  if(e.detail && e.detail.record) records.unshift(e.detail.record);
  renderList();
 });
 renderList();
})();
</script>
</body>
</html>
