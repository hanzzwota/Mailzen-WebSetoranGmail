<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MailZen — Login</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 0,#17303a,#0b1014 55%);color:#eaf0f4;font:14px system-ui}.card{width:min(420px,calc(100% - 28px));background:#141b21;border:1px solid #2b3742;border-radius:20px;padding:28px;box-shadow:0 20px 70px #0009}h1{margin:6px 0 8px}.brand{font-weight:900;letter-spacing:.1em}.brand span{color:#7dd3fc}.muted{color:#93a1ad}.tabs{display:flex;gap:8px;margin:22px 0}.tabs button,.btn{flex:1;padding:11px;border-radius:10px;border:1px solid #2b3742;background:#11171c;color:#eaf0f4}.tabs button.active,.primary{background:#7dd3fc;color:#06121a;font-weight:800}.form{display:none;gap:13px}.form.active{display:grid}.field{display:grid;gap:6px}.field input{padding:12px;border-radius:10px;border:1px solid #2b3742;background:#0c1115;color:#fff}.notice{min-height:20px;color:#fb7185}.small{font-size:12px}</style></head><body><main class="card"><div class="brand">MAIL<span>ZEN</span></div><h1>Masuk ke workspace</h1><p class="muted">Kelola pengajuan email dengan aman.</p><div class="tabs"><button id="loginTab" class="active">Login</button><button id="registerTab">Daftar</button></div><p class="notice" id="notice"></p><form id="loginForm" class="form active"><div class="field"><label>Email</label><input id="loginEmail" type="email" required></div><div class="field"><label>Password</label><input id="loginPassword" type="password" required></div><button class="btn primary">Masuk</button></form><form id="registerForm" class="form"><div class="field"><label>Nama lengkap</label><input id="registerName" required></div><div class="field"><label>Email</label><input id="registerEmail" type="email" required></div><div class="field"><label>Password minimal 8 karakter</label><input id="registerPassword" type="password" minlength="8" required></div><button class="btn primary">Buat akun</button></form><form id="otpForm" class="form"><p class="muted">Masukkan OTP yang dikirim ke <b id="otpEmail"></b>.</p><div class="field"><label>Kode OTP</label><input id="otpCode" inputmode="numeric" maxlength="8" required></div><button class="btn primary">Verifikasi email</button><button type="button" class="btn" id="resend">Kirim ulang OTP</button></form><p class="muted small">API key Resend hanya digunakan di server/Edge Function, tidak pernah di file ini.</p></main><script type="module">import{getSupabase}from'./supabase-config.js';const $=x=>document.getElementById(x),notice=m=>$('notice').textContent=m;let pendingEmail='';function tab(name){$('loginForm').classList.toggle('active',name==='login');$('registerForm').classList.toggle('active',name==='register');$('otpForm').classList.toggle('active',name==='otp');$('loginTab').classList.toggle('active',name==='login');$('registerTab').classList.toggle('active',name==='register')}async function redirect(){const sb=await getSupabase();const{data:{user}}=await sb.auth.getUser();if(!user)return;const{data:p}=await sb.from('profiles').select('role').eq('id',user.id).maybeSingle();location.replace(p?.role==='admin'?'admin.html':'app.html')}$('loginTab').onclick=()=>tab('login');$('registerTab').onclick=()=>tab('register');$('loginForm').onsubmit=async e=>{e.preventDefault();try{const sb=await getSupabase();const{error}=await sb.auth.signInWithPassword({email:$('loginEmail').value,password:$('loginPassword').value});if(error)throw error;await redirect()}catch(e){notice(e.message)}};$('registerForm').onsubmit=async e=>{e.preventDefault();try{const sb=await getSupabase();pendingEmail=$('registerEmail').value;const{data,error}=await sb.auth.signUp({email:pendingEmail,password:$('registerPassword').value,options:{data:{full_name:$('registerName').value}}});if(error)throw error;$('otpEmail').textContent=pendingEmail;tab('otp');notice('OTP verifikasi sudah dikirim.')}catch(e){notice(e.message)}};$('otpForm').onsubmit=async e=>{e.preventDefault();try{const sb=await getSupabase();const{error}=await sb.auth.verifyOtp({email:pendingEmail,type:'signup',token:$('otpCode').value});if(error)throw error;await redirect()}catch(e){notice(e.message)}};$('resend').onclick=async()=>{const sb=await getSupabase();const{error}=await sb.auth.resend({type:'signup',email:pendingEmail});notice(error?.message||'OTP dikirim ulang.');};if(new URLSearchParams(location.search).has('denied'))notice('Akses admin ditolak.');redirect();</script></body></html>
